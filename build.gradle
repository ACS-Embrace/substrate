import java.time.Duration

plugins {
    id 'java'
    id 'signing'
    id 'maven-publish'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

group = "com.gluonhq"

sourceCompatibility = JavaVersion.VERSION_11

repositories {
    mavenCentral()

//    maven {
//        url repsyUrl
//        credentials {
//            username repsyUsername
//            password repsyPassword
//        }
//    }
}

test {
    dependsOn publishToMavenLocal
    useJUnitPlatform()

    testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
        stackTraceFilters = []
    }
}

dependencies {
    implementation 'com.googlecode.plist:dd-plist:1.23'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.49'
    implementation 'org.graalvm.nativeimage:svm:21.1.0'
    implementation 'org.apidesign.bck2brwsr:aot:0.53'

    testImplementation gradleTestKit()
    testImplementation "org.junit.jupiter:junit-jupiter-api:$jUnitVersion"
    testImplementation "org.junit.jupiter:junit-jupiter-params:$jUnitVersion"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$jUnitVersion"
}

compileJava {
    doFirst {
        options.compilerArgs = ['--module-path', classpath.filter { f -> !f.name.endsWith(".tar.gz") }.asPath]
        classpath = files()
    }
}

javadoc {
    options.addStringOption("Xdoclint:none", "-quiet")
    options.addBooleanOption('html5', true)
    options.addBooleanOption('javafx', true)
    doFirst {
        options.modulePath = classpath.filter { f -> !f.name.endsWith(".tar.gz") }.flatten()
    }
}

build.dependsOn javadoc

// The commit each jar is built from, written into its manifest so any published jar can be traced.
// A "-dirty" suffix marks a build with uncommitted changes, which must not be published.
ext.gitCommit = {
    try {
        def os = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--always', '--dirty', '--abbrev=12', '--match', 'no-tags'
            standardOutput = os
            ignoreExitValue = true
        }
        return os.toString().trim() ?: 'unknown'
    } catch (Exception e) {
        return 'unknown'
    }
}()

tasks.withType(Jar).configureEach {
    manifest {
        attributes('Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Git-Commit': gitCommit)
    }
}

// Only committed release builds go to S3: test builds and snapshots stay in local Maven.
tasks.withType(PublishToMavenRepository).configureEach {
    doFirst {
        if (project.version.toString().contains('-dev') || project.version.toString().endsWith('-SNAPSHOT')) {
            throw new GradleException("${project.version} is a test build: publish it to local Maven only")
        }
        if (gitCommit.endsWith('-dirty') || gitCommit == 'unknown') {
            throw new GradleException("Commit your changes before publishing ${project.version}, so the jars match a commit")
        }
    }
}

task sourcesJar(type: Jar) {
    from sourceSets.main.allJava
    archiveClassifier = 'sources'
}

task javadocJar(type: Jar) {
    from javadoc
    archiveClassifier = 'javadoc'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url "s3://embrace-maven-archive/releases"
            credentials(AwsCredentials) {
                accessKey System.getenv("AWS_ACCESS_KEY_ID")
                secretKey System.getenv("AWS_SECRET_ACCESS_KEY")

            }
        }
    }

